name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: condominios_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d condominios_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci_local_only@127.0.0.1:5432/condominios_test
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_local_only@127.0.0.1:5432/condominios_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - name: Validate migrations against a clean PostgreSQL
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - run: python -m pytest -q
      - name: Validate Compose configuration
        working-directory: .
        run: docker compose --env-file .env.example config --quiet

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  storage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_local_only
          POSTGRES_DB: storage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d storage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://ci:ci_local_only@127.0.0.1:5432/storage_test
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci_local_only@127.0.0.1:5432/storage_test
      TEST_STORAGE_ENDPOINT: http://localhost:9000
      TEST_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9000
      TEST_STORAGE_ACCESS_KEY: ci_storage_user
      TEST_STORAGE_SECRET_KEY: ci_storage_local_only
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: python -m pip install -c requirements-dev.lock -e '.[dev]'
        working-directory: backend
      - name: Build MinIO from pinned official source
        run: docker build -t condominios-minio-test infra/minio
      - name: Start dedicated storage
        run: |
          docker run -d --name storage-test -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER="$TEST_STORAGE_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$TEST_STORAGE_SECRET_KEY" \
            condominios-minio-test
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live
      - name: Test private objects and externally signed downloads
        working-directory: backend
        run: |
          python -m alembic upgrade head
          python -m pytest -q -m storage
      - name: Stop dedicated storage
        if: always()
        run: docker rm -f storage-test || true
