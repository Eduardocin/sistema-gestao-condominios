# Ambiente de desenvolvimento.
#   Tudo em containers:            docker compose up --build
#   Só o banco (API/front locais): docker compose up -d --wait db
# Veja o README para detalhes.

x-backend: &backend
  build: ./backend
  env_file:
    - path: ${APP_ENV_FILE:-.env}
      required: false
  environment:
    # Dentro da rede do Compose o banco é o serviço "db" na porta interna 5432,
    # independentemente de POSTGRES_HOST/POSTGRES_PORT usados pela API local.
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    DATABASE_URL: ""
    CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173"]}
    STORAGE_ENDPOINT: http://storage:9000
    STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
    STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-condominios_storage_dev}
    STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?Defina STORAGE_SECRET_KEY no .env}
    STORAGE_BUCKET: ${STORAGE_BUCKET:-condominios-arquivos}
  volumes:
    - ./backend:/app

services:
  storage:
    build: ./infra/minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-condominios_storage_dev}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:?Defina STORAGE_SECRET_KEY no .env}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  storage-init:
    <<: *backend
    command: ["python", "-m", "app.modules.storage.bootstrap"]
    depends_on:
      storage:
        condition: service_healthy

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-condominios_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copie .env.example para .env antes de iniciar}
      POSTGRES_DB: ${POSTGRES_DB:-condominios}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *backend
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command:
      ["python", "-m", "uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build: ./frontend
    environment:
      # Endereço usado pelo navegador (na sua máquina), não pelo container.
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
      VITE_USE_POLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Mantém o node_modules instalado na imagem (Linux), sem misturar com o da máquina.
      - /app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data:
